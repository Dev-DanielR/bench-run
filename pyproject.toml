[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-run"
version = "0.1.0"
description = "TOML-driven experiment harness: Run, MatrixRun, CampaignRun"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "tomli-w",
  "alive-progress",
]

[project.optional-dependencies]
figures = ["matplotlib"]
coord = ["httpx", "starlette", "uvicorn", "python-multipart"]
dev = [
  "pytest",
  "matplotlib",
  "httpx",
  "starlette",
  "uvicorn",
  "python-multipart",
]

[tool.setuptools.packages.find]
include = ["bench_run*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
