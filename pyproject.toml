[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-run"
version = "0.1.0"
description = "TOML-driven experiment harness: Run, MatrixRun, CampaignRun"
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "httpx",
  "starlette",
  "uvicorn",
  "tomli-w",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["bench_run*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
